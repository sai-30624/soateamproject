# docker compose up --build
#   UI       -> http://localhost:3000
#   Gateway  -> http://localhost:8080
#   Eureka   -> http://localhost:8761
# Auth/User/Wallet/Transaction are NOT published to the host: clients can only reach them through the Gateway.

x-service: &service
  build:
    context: .
  restart: unless-stopped
  environment: &env
    DB_HOST: mysql
    DB_USER: root
    DB_PASS: root
    EUREKA_URL: http://eureka-server:8761/eureka
    JWT_SECRET: payvault-dev-secret-change-me-it-must-be-32-bytes-or-more
  depends_on:
    mysql:
      condition: service_healthy
    eureka-server:
      condition: service_started

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"            # 3307 on your machine, so it doesn't clash with a local MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  eureka-server:
    build:
      context: .
      args: { MODULE: eureka-server }
    environment:
      EUREKA_HOST: eureka-server
    ports:
      - "8761:8761"

  auth-service:
    <<: *service
    build: { context: ., args: { MODULE: auth-service } }

  user-service:
    <<: *service
    build: { context: ., args: { MODULE: user-service } }

  wallet-service:
    <<: *service
    build: { context: ., args: { MODULE: wallet-service } }

  transaction-service:
    <<: *service
    build: { context: ., args: { MODULE: transaction-service } }

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: payvault-dev-secret-change-me-it-must-be-32-bytes-or-more
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server

  payvault-ui:
    build: ./payvault-ui
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  mysql-data:
