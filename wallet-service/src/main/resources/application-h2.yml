# Profile "h2": runs this service without MySQL.
# Start with:  java -jar wallet-service/target/wallet-service.jar --spring.profiles.active=h2
# Data is kept in ./data/payvault_wallet.mv.db (MySQL compatibility mode).
# WRITE_DELAY=0 flushes every commit to disk, so a killed service (fault-tolerance demo) never loses committed money.
spring:
  datasource:
    url: jdbc:h2:file:./data/payvault_wallet;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;WRITE_DELAY=0
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
